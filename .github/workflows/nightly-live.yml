name: nightly-live-smoke

# Removed the cron schedule: GitHub Actions runner IPs are blocked by
# Coinbase's WebSocket endpoint, causing consistent "0 symbols" failures
# that represent network policy, not code correctness.
#
# Trigger manually (workflow_dispatch) from a machine or self-hosted runner
# that has confirmed connectivity to advanced-trade-api.coinbase.com.
# The main CI e2e-smoke-replay covers code correctness deterministically.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live-smoke:
    name: coinbase-live-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pre-check Coinbase WebSocket reachability
        id: reachability
        run: |
          python3 - <<'EOF'
          import socket, ssl, sys

          host = "advanced-trade-api.coinbase.com"
          port = 443
          try:
              ctx = ssl.create_default_context()
              with socket.create_connection((host, port), timeout=10) as sock:
                  with ctx.wrap_socket(sock, server_hostname=host):
                      pass
              print(f"Reachable: {host}:{port}")
              sys.exit(0)
          except Exception as e:
              print(f"UNREACHABLE: {host}:{port} — {e}")
              print("Skipping live smoke: Coinbase WS is not reachable from this runner.")
              print("Run this workflow on a self-hosted runner with outbound WebSocket access.")
              sys.exit(2)
          EOF
        continue-on-error: true

      - name: Skip if unreachable
        if: steps.reachability.outcome == 'failure'
        run: |
          echo "Coinbase endpoint not reachable from this runner. Exiting cleanly."
          echo "To test live connectivity, run on a self-hosted runner."
          exit 0

      - name: Start live Coinbase stack (keyless, bounded 90s)
        if: steps.reachability.outcome == 'success'
        run: |
          FEED_TIMEOUT_SECONDS=90 \
          docker compose -f infra/docker-compose.yml --profile coinbase up -d --build \
            redpanda redis feed-handler stream-processor market-data-api coinbase-feed

      - name: Wait for API health
        if: steps.reachability.outcome == 'success'
        run: bash scripts/wait-for-health.sh http://localhost:8000/health 60

      - name: Wait for live data to arrive (60s)
        if: steps.reachability.outcome == 'success'
        run: sleep 60

      - name: Assert at least one symbol populated
        if: steps.reachability.outcome == 'success'
        run: |
          SYMBOLS=$(curl -fsS http://localhost:8000/symbols | python3 -c 'import json,sys; s=json.load(sys.stdin)["symbols"]; print(len(s))')
          echo "Symbols in Redis: $SYMBOLS"
          python3 -c "assert int('$SYMBOLS') >= 1, 'No symbols populated after 60s'"

      - name: Assert BTC-USD has live quote data
        if: steps.reachability.outcome == 'success'
        run: |
          curl -fsS http://localhost:8000/latest/BTC-USD \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("latest_quote") is not None, f"No quote: {d}"'

      - name: Dump container logs on failure
        if: failure() && steps.reachability.outcome == 'success'
        run: |
          echo "=== coinbase-feed logs ==="
          docker compose -f infra/docker-compose.yml logs coinbase-feed --tail=100
          echo "=== feed-handler logs ==="
          docker compose -f infra/docker-compose.yml logs feed-handler --tail=50
          echo "=== stream-processor logs ==="
          docker compose -f infra/docker-compose.yml logs stream-processor --tail=50

      - name: Tear down
        if: always() && steps.reachability.outcome == 'success'
        run: docker compose -f infra/docker-compose.yml --profile coinbase down -v

      - name: Open issue on failure
        if: failure() && steps.reachability.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Coinbase live smoke failed: ${new Date().toISOString().slice(0,10)}`;
            const body = [
              `The Coinbase live smoke failed on run [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).`,
              '',
              'Note: the pre-check confirmed Coinbase WS was reachable from the runner, so this is a genuine pipeline failure rather than a network block.',
              '',
              'Check for upstream API changes or inspect the dumped container logs in the run above.',
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['coinbase-smoke']
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['coinbase-smoke']
              });
            }
