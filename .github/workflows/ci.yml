name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: python-tests-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: PYTHONPYCACHEPREFIX=/tmp/pycache python -m compileall -q market_platform tests lakehouse/jobs
      - name: Tests
        run: python -m pytest -q
      - name: Validate production artifacts
        run: python scripts/validate-production-artifacts.py

  docker:
    name: docker-builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose -f infra/docker-compose.yml config
      - name: Build Python runtime image
        run: docker build -f infra/python-service.Dockerfile -t llmdp-python-service:ci .
      - name: Build Flink runtime image
        run: docker build -f infra/flink-job.Dockerfile -t llmdp-flink-job:ci .

  flink:
    name: flink-maven-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package Flink job
        run: mvn -f services/stream-processor/flink/pom.xml -DskipTests package

  e2e-smoke:
    name: e2e-smoke-replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start replay stack
        run: |
          docker compose -f infra/docker-compose.yml --profile replay up -d --build \
            redpanda redis feed-handler stream-processor market-data-api replay-feed
      - name: Wait for API health
        run: bash scripts/wait-for-health.sh http://localhost:8000/health 120
      - name: Assert BTC-USD snapshot populated
        run: |
          sleep 5
          curl -fsS http://localhost:8000/latest/BTC-USD \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d["symbol"]=="BTC-USD", f"Unexpected: {d}"'
      - name: Run load test
        run: |
          python -m pip install --quiet httpx
          python scripts/load-test-local.py --symbol BTC-USD --requests 200 --concurrency 10 --json-out perf.json
      - uses: actions/upload-artifact@v4
        with:
          name: latency-report-${{ github.run_id }}
          path: perf.json
      - name: Assert research insights populated (replay)
        run: |
          docker compose -f infra/docker-compose.yml --profile research-replay up --build \
            --exit-code-from research-replay research-replay redis
          sleep 2
          curl -fsS http://localhost:8000/research/BTC-USD \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert len(d["insights"])>=1, f"No research insights: {d}"'
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=300
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml --profile replay --profile research-replay down -v
