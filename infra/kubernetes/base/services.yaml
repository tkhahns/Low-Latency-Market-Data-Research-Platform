apiVersion: v1
kind: Service
metadata:
  name: feed-ingestor
  namespace: market-data
spec:
  type: ClusterIP
  selector:
    app: feed-ingestor
  ports:
    - name: health
      port: 8020
      targetPort: health
---
apiVersion: v1
kind: Service
metadata:
  name: market-data-api
  namespace: market-data
spec:
  type: ClusterIP
  selector:
    app: market-data-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-ops-server
  namespace: market-data
spec:
  type: ClusterIP
  selector:
    app: mcp-ops-server
  ports:
    - name: http
      port: 8010
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: research-ingestor
  namespace: market-data
spec:
  type: ClusterIP
  selector:
    app: research-ingestor
  ports:
    - name: health
      port: 8030
      targetPort: health
